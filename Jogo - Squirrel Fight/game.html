<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squirrel Fight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
        }

        /* UI Overlay */
        #ui {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Top Timer */
        #timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba0, 0, 0, 0.8;
        }

        /* Player Counters */
        #counter1, #counter2 {
            position: absolute;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba0, 0, 0, 0.8;
        }

        #counter1 {
            bottom: 20px;
            right: 20px;
        }

        #counter2 {
            bottom: 20px;
            left: 20px;
        }

        /* Crowns next to counters */
        #crown1, #crown2 {
            width: 32px;
            height: 32px;
            position: absolute;
            top: 4px;
        }

        #crown1 { right: 56px; }
        #crown2 { left: 56px; }

        /* Buttons */
        .btn {
            position: fixed;
            cursor: pointer;
            pointer-events: auto;
        }

        #btnPlay {
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            background: url('Botões/BotãoPlay.gif') no-repeat center/contain;
        }

        #btnExit {
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            background: url('Botões/BotãoExit.gif') no-repeat center/contain;
        }

        #btnConfig {
            left: 50%;
            bottom: 140px;
            transform: translateX(-50%);
            width: 120px;
            height: 40px;
            background: url('Botões/botãoConf.gif') no-repeat center/contain;
        }

        #btnConfigGame {
            left: 50%;
            bottom: 140px;
            transform: translateX(-50%) scale(0);
            width: 120px;
            height: 40px;
            background: url('Sprites de Elementos/SpriteConfiguraçãoJogo.gif') no-repeat center/contain;
            display: none;
        }

        #btnBackToMenu {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 100px;
            height: 30px;
            background: url('Botões/BotãoMenu.gif') no-repeat center/contain;
            display: none;
        }

        /* Configuration Screen */
        #configScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('Sprites de Elementos/SpriteConfiguraçãoTelaInicial.gif') no-repeat center/contain;
            display: none;
            z-index: 200;
        }

        #configGameScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('Sprites de Elementos/SpriteConfiguraçãoJogo.gif') no-repeat center/contain;
            display: none;
            z-index: 200;
        }

        /* Tutorial */
        #tutorial {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('Cenários/Sprites do Cenário/SpriteTutorial.gif') no-repeat center/contain;
            display: none;
            z-index: 150;
        }

        /* Game Over */
        #gameOver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 250;
            color: white;
            font-size: 24px;
        }

        /* Win/Lose Sashes */
        .sash-vitoria {
            position: absolute;
            width: 40px;
            height: 10px;
            background: url('Sprites de Elementos/SpriteFaixaDeVitoria.gif') no-repeat center/contain;
            pointer-events: none;
        }

        .sash-derrota {
            position: absolute;
            width: 40px;
            height: 10px;
            background: url('Sprites de Elementos/SpriteFaixaDeDerrota.pixil.gif') no-repeat center/contain;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="200" height="200"></canvas>
    
    <div id="ui">
        <div id="timer">1:30</div>
        <div id="counter1">0 <img id="crown1" src="Sprites de Elementos/SpriteCoroa.gif" alt="Coroa"></div>
        <div id="counter2">0 <img id="crown2" src="Sprites de Elementos/SpriteCoroa.gif" alt="Coroa"></div>
        
        <button id="btnPlay" class="btn">Jogar</button>
        <button id="btnExit" class="btn">Sair</button>
        <button id="btnConfig" class="btn">Config.</button>
        <button id="btnConfigGame" class="btn">Config.</button>
        <button id="btnBackToMenu" class="btn">Voltar</button>
        
        <div id="configScreen">
            <!-- Configuração tela inicial -->
            <button id="btnBackInitial" style="position: absolute; left: 20px; bottom: 20px; width: 80px; height: 25px; background: url('Botões/BotãoMenu.gif') no-repeat center/contain;">Voltar</button>
        </div>

        <div id="configGameScreen">
            <!-- Configuração durante o jogo -->
            <button id="btnPause" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); width: 80px; height: 25px; background: url('Botões/botãoConf.gif') no-repeat center/contain;">Pause</button>
        </div>

        <div id="tutorial">
            <!-- Tutorial screen -->
        </div>

        <div id="gameOver">
            <span id="gameOverText">Fim de Jogo!</span>
            <span id="winnerText">Vencedor: <span id="winnerName">Player 1</span></span>
        </div>
    </div>

    <audio id="musicInitial">
        <source src="Sons/MúsicaInicial.mp3" type="audio/mpeg">
    </audio>
    <audio id="musicPlay">
        <source src="Sons/MúsicaInicialPlay.mp3" type="audio/mpeg">
    </audio>
    <audio id="soundJump"></audio>
    <audio id="soundCollectNormal"></audio>
    <audio id="soundCollectGolden"></audio>
    <audio id="soundCountdown"></audio>
    <audio id="soundGameOver"></audio>
    <audio id="soundTalk"></audio>

</body>
</html>
