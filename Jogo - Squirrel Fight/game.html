<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squirrel Fight</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e; /* bordas em volta do jogo 200x200 */
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* O jogo inteiro é desenhado no canvas (proporção 200x200). */
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #loading {
            position: fixed;
            color: #ffd27a;
            font: bold 18px sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="loading">Carregando...</div>

    <!-- Folhas de sprites geradas por tools/build_assets.py -->
    <script src="assets/sprites.js"></script>
    <script src="game.js"></script>
</body>
</html>
